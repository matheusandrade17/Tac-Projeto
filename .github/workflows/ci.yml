name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validar configuracao do SonarCloud
        run: |
          test -n "$SONAR_TOKEN" || (echo "SONAR_TOKEN nao configurado nos secrets do repositorio." && exit 1)
          test -n "$SONAR_ORGANIZATION" || (echo "SONAR_ORGANIZATION nao configurado nos secrets do repositorio." && exit 1)
          test -n "$SONAR_PROJECT_KEY" || (echo "SONAR_PROJECT_KEY nao configurado nos secrets do repositorio." && exit 1)

      - name: Instalar contratos compartilhados
        run: mvn -B -f services/contracts/pom.xml clean install -DskipTests

      - name: Wait for Redis (127.0.0.1:6379)
        run: |
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 6379; then
              echo "Redis is up"
              exit 0
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 1
          done
          echo "Redis did not start in time"
          exit 1

      - name: Testes e cobertura - aluno-service
        run: mvn -B -f services/aluno-service/pom.xml clean verify -Dspring.redis.host=127.0.0.1 -Dspring.redis.port=6379

      - name: Testes e cobertura - disciplina-service
        run: mvn -B -f services/disciplina-service/pom.xml clean verify

      - name: Testes e cobertura - matricula-service
        run: mvn -B -f services/matricula-service/pom.xml clean verify

      - name: Testes e cobertura - avaliacao-service
        run: mvn -B -f services/avaliacao-service/pom.xml clean verify

      - name: Build e cobertura - gateway
        run: mvn -B -f services/gateway/pom.xml clean verify

      - name: Build e cobertura - notificacoes
        run: mvn -B -f services/notificacoes/pom.xml clean verify

      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Esta variável força o uso do Java que já está rodando no runner
          SONAR_SCANNER_OPTS: "-Dsonar.scanner.useJava=true"
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.sources=services/aluno-service/src/main/java,services/disciplina-service/src/main/java,services/matricula-service/src/main/java,services/avaliacao-service/src/main/java,services/gateway/src/main/java,services/notificacoes/src/main/java
            -Dsonar.tests=services/aluno-service/src/test/java,services/disciplina-service/src/test/java,services/matricula-service/src/test/java,services/avaliacao-service/src/test/java
            -Dsonar.exclusions=**/target/**,**/.idea/**,**/.git/**,docker/**,docs/**,**/src/test/resources/**,**/src/test/java/**