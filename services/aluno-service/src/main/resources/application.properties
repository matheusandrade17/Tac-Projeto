# Server Configuration
server.port=8081

# Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# PostgreSQL Database Configuration (Flyway)
spring.datasource.url=jdbc:postgresql://postgres:5432/tac_aluno
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=tac
spring.datasource.password=tac

# JPA Configuration
# Evita que Hibernate tente criar/drop (Flyway controla o schema)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway (Migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis Cache (Spring Cache)
spring.data.redis.host=redis
spring.data.redis.port=6379
tac.cache.default-ttl-seconds=60
spring.cache.redis.key-prefix=tac-cache:

# RabbitMQ Configuration
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=tac
spring.rabbitmq.password=tac

# Mensageria (RabbitMQ)
messageria.exchange=tac.academico.events
