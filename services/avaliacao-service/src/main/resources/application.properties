# Server Configuration
server.port=8084

# Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/tac_avaliacao
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=tac
spring.datasource.password=tac
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true





# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Comunicação inter-serviços (Docker-friendly)
services.aluno.base-url=http://aluno-service:8081/api/v1/alunos
services.disciplina.base-url=http://disciplina-service:8082/api/v1/disciplinas
http.client.connect-timeout=2s
http.client.read-timeout=2s

# Resilience4j - chamadas HTTP para aluno-service e disciplina-service
resilience4j.retry.instances.aluno-service.max-attempts=3
resilience4j.retry.instances.aluno-service.wait-duration=500ms
resilience4j.retry.instances.aluno-service.enable-exponential-backoff=true
resilience4j.retry.instances.aluno-service.exponential-backoff-multiplier=2
resilience4j.retry.instances.disciplina-service.max-attempts=3
resilience4j.retry.instances.disciplina-service.wait-duration=500ms
resilience4j.retry.instances.disciplina-service.enable-exponential-backoff=true
resilience4j.retry.instances.disciplina-service.exponential-backoff-multiplier=2
resilience4j.circuitbreaker.instances.aluno-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.aluno-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.aluno-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.aluno-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.aluno-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.disciplina-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.disciplina-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.disciplina-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.disciplina-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.disciplina-service.wait-duration-in-open-state=30s
resilience4j.timelimiter.instances.aluno-service.timeout-duration=3s
resilience4j.timelimiter.instances.aluno-service.cancel-running-future=true
resilience4j.timelimiter.instances.disciplina-service.timeout-duration=3s
resilience4j.timelimiter.instances.disciplina-service.cancel-running-future=true

# Mensageria (RabbitMQ)
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=tac
spring.rabbitmq.password=tac
messageria.exchange=tac.academico.events

# Observabilidade (Actuator + Prometheus + Tracing Brave)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=never
management.metrics.export.prometheus.enabled=true

management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# Logs com correlação (MDC)
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} traceId=%X{traceId:-} spanId=%X{spanId:-} - %msg%n




