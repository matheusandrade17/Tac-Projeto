# Server Configuration
server.port=8084

# Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# H2 Database Configuration (in-memory)
spring.datasource.url=jdbc:h2:mem:avaliacaodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Comunicação inter-serviços (Docker-friendly)
services.aluno.base-url=http://aluno-service:8081/api/v1/alunos
services.disciplina.base-url=http://disciplina-service:8082/api/v1/disciplinas
http.client.connect-timeout=2s
http.client.read-timeout=2s

# Mensageria (RabbitMQ)
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=tac
spring.rabbitmq.password=tac
messageria.exchange=tac.academico.events

# Observabilidade (Actuator + Prometheus + Tracing Brave)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=never
management.metrics.export.prometheus.enabled=true

management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# Logs com correlação (MDC)
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} traceId=%X{traceId:-} spanId=%X{spanId:-} - %msg%n




