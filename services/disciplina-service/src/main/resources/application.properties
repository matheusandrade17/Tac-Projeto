# Server Configuration
server.port=8082

# Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/tac_disciplina
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=tac
spring.datasource.password=tac
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true



# Mensageria (RabbitMQ)
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=tac
spring.rabbitmq.password=tac
messageria.exchange=tac.academico.events

# Redis (Spring Cache)
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.cache.redis.key-prefix=tac-cache:
tac.cache.default-ttl-seconds=60


