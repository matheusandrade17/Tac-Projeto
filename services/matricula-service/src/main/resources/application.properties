# Server Configuration
server.port=8083

# Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# PostgreSQL Database Configuration (Flyway)
spring.datasource.url=jdbc:postgresql://postgres:5432/tac_matricula
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=tac
spring.datasource.password=tac

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway (Migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Comunica��o inter-servi�os (Docker-friendly)
services.aluno.base-url=http://aluno-service:8081/api/v1/alunos
services.disciplina.base-url=http://disciplina-service:8082/api/v1/disciplinas
http.client.connect-timeout=2s
http.client.read-timeout=2s

# RabbitMQ Configuration
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=tac
spring.rabbitmq.password=tac

# Mensageria (RabbitMQ)
messageria.exchange=tac.academico.events

# Redis (Spring Cache)
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.cache.redis.key-prefix=tac-cache:
tac.cache.default-ttl-seconds=60

# Observabilidade (Actuator + Prometheus + Tracing Brave)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=never
management.metrics.export.prometheus.enabled=true

management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# Logs com correlação (MDC)
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} traceId=%X{traceId:-} spanId=%X{spanId:-} - %msg%n

