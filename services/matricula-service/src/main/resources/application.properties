# Server Configuration
server.port=8083

# Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# PostgreSQL Database Configuration (Flyway)
spring.datasource.url=jdbc:postgresql://postgres:5432/tac_matricula
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=tac
spring.datasource.password=tac

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway (Migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Comunicação inter-serviços (Docker-friendly)
services.aluno.base-url=http://aluno-service:8081/api/v1/alunos
services.disciplina.base-url=http://disciplina-service:8082/api/v1/disciplinas

# RabbitMQ Configuration
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=tac
spring.rabbitmq.password=tac

# Mensageria (RabbitMQ)
messageria.exchange=tac.academico.events

# Redis (Spring Cache)
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.cache.redis.key-prefix=tac-cache:
tac.cache.default-ttl-seconds=60
