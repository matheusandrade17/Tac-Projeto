server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:

        - id: aluno-service
          uri: http://aluno-service:8081
          predicates:
            - Path=/api/v1/alunos/**
          filters:
            - RewritePath=/api/v1/alunos/(?<segment>.*), /api/v1/alunos/${segment}

        - id: disciplina-service
          uri: http://disciplina-service:8082
          predicates:
            - Path=/api/v1/disciplinas/**
          filters:
            - RewritePath=/api/v1/disciplinas/(?<segment>.*), /api/v1/disciplinas/${segment}

        - id: matricula-service
          uri: http://matricula-service:8083
          predicates:
            - Path=/api/v1/matriculas/**
          filters:
            - RewritePath=/api/v1/matriculas/(?<segment>.*), /api/v1/matriculas/${segment}

        - id: avaliacao-service
          uri: http://avaliacao-service:8084
          predicates:
            - Path=/api/v1/avaliacoes/**
          filters:
            - RewritePath=/api/v1/avaliacoes/(?<segment>.*), /api/v1/avaliacoes/${segment}

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

# Observabilidade (Actuator + Prometheus + Tracing Brave)
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: "never"
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} traceId=%X{traceId:-} spanId=%X{spanId:-} - %msg%n"

