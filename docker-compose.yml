version: '3.8'

services:
  aluno-service:
    build: ./services/aluno-service
    container_name: aluno-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=tac
      - RABBITMQ_PASS=tac
    depends_on:
      - rabbitmq
      - postgres
    networks:
      - tac-network

  disciplina-service:
    build: ./services/disciplina-service
    container_name: disciplina-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=tac
      - RABBITMQ_PASS=tac
    depends_on:
      - rabbitmq
    networks:
      - tac-network

  matricula-service:
    build:
      context: .
      dockerfile: services/matricula-service/Dockerfile
    container_name: matricula-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=tac
      - RABBITMQ_PASS=tac
    depends_on:
      - rabbitmq
      - postgres
    networks:
      - tac-network

  avaliacao-service:
    build: ./services/avaliacao-service
    container_name: avaliacao-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=tac
      - RABBITMQ_PASS=tac
    depends_on:
      - rabbitmq
    networks:
      - tac-network

  gateway:
    build: ./services/gateway
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - aluno-service
      - disciplina-service
      - matricula-service
      - avaliacao-service
      - rabbitmq
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=tac
      - RABBITMQ_PASS=tac
    networks:
      - tac-network

  notificacoes:
    build:
      context: .
      dockerfile: services/notificacoes/Dockerfile
    container_name: notificacoes
    restart: unless-stopped
    ports:
      - "8085:8081"
    depends_on:
      - rabbitmq
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=tac
      - RABBITMQ_PASS=tac
    networks:
      - tac-network
    
  redis:
    image: redis:7-alpine
    container_name: tac_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - tac-network
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tac_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: tac
      RABBITMQ_DEFAULT_PASS: tac
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tac-network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: tac_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - tac-network

  postgres:
    image: postgres:15-alpine
    container_name: tac_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tac
      POSTGRES_PASSWORD: tac
      POSTGRES_DB: tac_aluno
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tac"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tac-network

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: tac_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "4317:4317"
      - "4318:4318"
    networks:
      - tac-network

  loki:
    image: grafana/loki:2.9.6
    container_name: tac_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - tac-network
    volumes:
      - ./docker/loki:/etc/loki

  promtail:
    image: grafana/promtail:2.9.6
    container_name: tac_promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/promtail:/etc/promtail
    command: -config.file=/etc/promtail/config.yml
    networks:
      - tac-network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.0.0
    container_name: tac_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
    depends_on:
      - prometheus
      - jaeger
      - loki
    networks:
      - tac-network

networks:
  tac-network:
    driver: bridge

volumes:
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
