<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <a href="../index.html" class="navbar-brand">← Voltar</a>
            <span class="text-white">Plataforma Acadêmica</span>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="mb-4">
            <h1 class="titulo-pagina">Gestão de Alunos</h1>
            <p class="text-muted">Cadastro e gerenciamento de alunos da plataforma.</p>
        </div>

        <div class="card sistema-card p-4 mb-4">
            <h3 class="mb-4">Cadastrar Aluno</h3>
            <div class="row">
                <div class="col-md-6">
                    <label class="form-label">Nome do Aluno</label>
                    <input type="text" id="nome" class="form-control mb-3" placeholder="Digite o nome do aluno">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control mb-3" placeholder="Digite o email">
                </div>
            </div>
            <button class="btn btn-primary" onclick="cadastrarAluno()">Salvar</button>
        </div>

        <div class="card sistema-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Lista de Alunos</h3>
                <span class="badge bg-primary">Sistema Acadêmico</span>
            </div>
            <ul id="lista" class="list-group">
                <li class="list-group-item">Nenhum aluno cadastrado</li>
            </ul>
        </div>

    </div>

    <script src="../js/alunos.js"></script>

</body>
</html>
